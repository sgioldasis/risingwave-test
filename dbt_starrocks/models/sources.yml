version: 2

sources:
  - name: risingwave
    database: risingwave
    schema: public
    tables:
      - name: funnel_summary

  - name: databricks_uc
    database: databricks_uc
    schema: sr_poc_external
    tables:
      - name: funnel_summary_historical
      - name: iceberg_countries

  - name: sr_local_db
    # default_catalog = this cluster's internal catalog (name confirmed via
    # SHOW CATALOGS -- StarRocks's docs say "internal", this stack says
    # default_catalog; dbt renders sources as catalog.schema.table)
    database: default_catalog
    schema: sr_local_db_sr_local_db
    tables:
      - name: page_views_direct
      - name: dim_users

  - name: lakekeeper_local
    database: lakekeeper_local
    schema: public
    tables:
      - name: funnel_summary
