name: 'starrocks_unified_funnel'
version: '1.0.0'
config-version: 2

profile: 'starrocks_profile'

model-paths: ['models']
analysis-paths: ['analysis']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

on-run-start:
  - 'CREATE EXTERNAL CATALOG IF NOT EXISTS databricks_uc COMMENT ''Databricks Unity Catalog de_dev via Iceberg REST'' PROPERTIES ( ''type'' = ''iceberg'', ''iceberg.catalog.type'' = ''rest'', ''iceberg.catalog.uri'' = ''{{ env_var("DATABRICKS_HOST", "https://adb-1608121643336927.7.azuredatabricks.net") }}/api/2.1/unity-catalog/iceberg-rest'', ''iceberg.catalog.warehouse'' = ''de_dev'', ''iceberg.catalog.credential'' = ''{{ env_var("DATABRICKS_AZURE_CLIENT_ID", "") }}:{{ env_var("DATABRICKS_AZURE_CLIENT_SECRET", "") }}'', ''iceberg.catalog.oauth2-server-uri'' = ''https://login.microsoftonline.com/{{ env_var("DATABRICKS_AZURE_TENANT_ID", "") }}/oauth2/v2.0/token'', ''iceberg.catalog.scope'' = ''2ff814a6-3304-4ab8-85cb-cd0e6f879c1d/.default'' )'
  - 'CREATE EXTERNAL CATALOG IF NOT EXISTS lakekeeper_local COMMENT ''Local Lakekeeper REST catalog backed by MinIO'' PROPERTIES ( ''type'' = ''iceberg'', ''iceberg.catalog.type'' = ''rest'', ''iceberg.catalog.uri'' = ''http://lakekeeper:8181/catalog/'', ''iceberg.catalog.warehouse'' = ''risingwave-warehouse'', ''aws.s3.endpoint'' = ''http://minio-0:9301'', ''aws.s3.access_key'' = ''hummockadmin'', ''aws.s3.secret_key'' = ''hummockadmin'', ''aws.s3.enable_path_style_access'' = ''true'', ''aws.s3.region'' = ''us-east-1'' )'
  - 'CREATE EXTERNAL CATALOG IF NOT EXISTS risingwave COMMENT ''RisingWave PostgreSQL JDBC federation pilot'' PROPERTIES ( ''type'' = ''jdbc'', ''user'' = ''root'', ''password'' = ''root'', ''jdbc_uri'' = ''jdbc:postgresql://frontend-node-0:4566/dev'', ''driver_url'' = ''https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.7/postgresql-42.7.7.jar'', ''driver_class'' = ''org.postgresql.Driver'', ''schema_resolver'' = ''postgresql'' )'

models:
  starrocks_unified_funnel:
    +schema: 'sr_local_db'
