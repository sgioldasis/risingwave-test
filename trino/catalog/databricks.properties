# Trino Iceberg Connector — Databricks Unity Catalog (IRC)
# Connects to de_dev.rw_poc via the Unity Catalog Iceberg REST API.
# Query example: SELECT * FROM databricks.rw_poc.rw_casino_transactions LIMIT 10;

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=https://adb-1608121643336927.7.azuredatabricks.net/api/2.1/unity-catalog/iceberg-rest
iceberg.rest-catalog.warehouse=de_dev

# OAuth2 — Azure AD service principal (same SP used by RisingWave sinks)
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.server-uri=https://login.microsoftonline.com/78395483-9425-447a-ba64-60b90f6bb16e/oauth2/v2.0/token
iceberg.rest-catalog.oauth2.credential=${ENV:DATABRICKS_AZURE_CLIENT_ID}:${ENV:DATABRICKS_AZURE_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=2ff814a6-3304-4ab8-85cb-cd0e6f879c1d/.default

# Azure ADLS Gen2 — direct Parquet access.
# TEST 2026-09-07: trying the same DATABRICKS_AZURE_* service principal
# StarRocks uses (via credential vending) instead of the separate ADLS_*
# principal, whose storage RBAC appears broken (auths fine, fails at the
# storage authorization layer). Trino itself cannot use credential vending
# for Azure (confirmed via https://github.com/trinodb/trino/issues/23238 --
# a known, still-unresolved limitation), so it always needs a directly
# configured identity here regardless of which one.
fs.azure.enabled=true
azure.auth-type=OAUTH
azure.oauth.tenant-id=${ENV:DATABRICKS_AZURE_TENANT_ID}
azure.oauth.endpoint=https://login.microsoftonline.com/${ENV:DATABRICKS_AZURE_TENANT_ID}/oauth2/token
azure.oauth.client-id=${ENV:DATABRICKS_AZURE_CLIENT_ID}
azure.oauth.secret=${ENV:DATABRICKS_AZURE_CLIENT_SECRET}
