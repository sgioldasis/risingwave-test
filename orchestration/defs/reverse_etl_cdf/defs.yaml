# The demo sync. Every name is derived from `name`: reverse_etl_cdf_source,
# reverse_etl_cdf_target, reverse_etl_cdf_topic, reverse_etl_cdf_sink,
# reverse_etl_cdf_setup_job, ... This file is the only definition of the POC, including its demo seed (run as the
# last step of reverse_etl_cdf_setup_job).
# No `encoding` field -- the component's default is JSON with the schema
# embedded in every message (the avro and delta syncs opt into the registry's
# Avro).
type: orchestration.components.reverse_etl_cdf_demo.ReverseEtlCdfDemo

attributes:
  # The label the Dagster object names derive from (reverse_etl_cdf_to_kafka, the
  # cdf_setup_job / _reset_job, ...). The watermark key and the Debezium envelope prefix
  # are `sync_name` in the sync block -- changing that for an existing sync restarts it
  # from the beginning.
  name: cdf

  # The sync's own side of the seam (plan section 13): the source's location, the external
  # names of what the sync touches, and the sync's behavior. The field names are the reusable
  # component's, so this block promotes verbatim into a team's YAML.
  sync:
    # The infrastructure names, explicit (plan section 11): the watermark key, the tables
    # and the topic this sync touches. Nothing is derived from `name` -- `name`
    # only derives the Dagster object names.
    sync_name: reverse_etl_cdf
    source_table: reverse_etl_cdf_source
    state_table: reverse_etl_cdf_state
    kafka_topic: reverse_etl_cdf_topic
    # Same drop propagation as avro (see that defs.yaml).
    propagate_drops: true
    # The Databricks catalog and scratch schema where the setup creates the source
    # and the watermark state table; the reset job only drops reverse_etl_* names
    # here.
    catalog: de_dev
    schema_name: sr_poc_external
    # Column DDL the setup asset creates the source table with (the component adds
    # the identity key `rid` itself -- the key everywhere downstream). Used only
    # when the table has to be created; never applied to an existing table.
    source_columns:
      - "id BIGINT NOT NULL"
      - "value STRING"
      - "updated_at TIMESTAMP"
    # Demo seed, run as the LAST step of the setup job -- after the setup's own
    # baseline sync, so the watermark starts at the pre-seed version and it is the
    # chain's first data sync that lands these rows on the targets. {source_table}
    # is substituted with the source table name. The MERGE keeps re-runs
    # idempotent, and the trailing update + delete give every fresh setup its
    # first update and delete events.
    seed_statements:
      - |
        MERGE INTO {source_table} AS target
        USING (
          SELECT 1 AS id, 'first' AS value, current_timestamp() AS updated_at
          UNION ALL SELECT 2, 'second', current_timestamp()
          UNION ALL SELECT 3, 'third', current_timestamp()
        ) AS source
        ON target.id = source.id
        WHEN MATCHED THEN UPDATE SET target.value = source.value, target.updated_at = source.updated_at
        WHEN NOT MATCHED THEN INSERT (id, value, updated_at) VALUES (source.id, source.value, source.updated_at)
      - "UPDATE {source_table} SET value = 'second-updated', updated_at = current_timestamp() WHERE id = 2"
      - "DELETE FROM {source_table} WHERE id = 3"

  # The downstream side of the seam: the target names and the selection. The targets are
  # consumers of the sync's topic; the sync itself knows nothing of them.
  targets:
    connector_name: reverse_etl_cdf_sink
    postgres_table: reverse_etl_cdf_target
    risingwave_table: reverse_etl_cdf_target
