# The Avro trial: the same data as the cdf sync, with the messages in Avro (Confluent wire format,
# schemas in the shared staging registry) instead of JSON with the schema embedded. Own source table
# (reverse_etl_avro_source), topic, connector and target tables, so it can be compared side by side with cdf.
# See docs/poc/REVERSE_ETL_DEBEZIUM_JDBC_SINK.md, section 14.1.
type: orchestration.components.reverse_etl_cdf_sync.ReverseEtlCdfSync

attributes:
  # The sync label every other name derives from: reverse_etl_avro_source /
  # _state / _topic / _sink, the avro_setup_job / _reset_job / make-change job,
  # and the Postgres + RisingWave target tables. It is also the watermark key
  # and the Debezium envelope prefix -- changing it on an existing sync
  # restarts that sync from the beginning.
  name: avro
  # The Kafka message format: "avro" = Confluent wire format with the schemas in
  # the staging registry (one <topic>-key and <topic>-value subject per topic);
  # the alternative "json" embeds the schema in every message and is what cdf
  # and orders use by default.
  encoding: avro
  # Drop propagation: a column dropped from the source (the change dropdown's
  # "drop a column", or manually in Databricks) is dropped from RisingWave and
  # Postgres at the next sync; a renamed column is renamed on both with its
  # target data preserved (RisingWave via add + update-copy + drop, Postgres via
  # a native rename plus a sink task restart). Evidence-gated via the state
  # table's last_schema, which records each column's delta.columnMapping.id.
  propagate_drops: true
  # The Databricks catalog and scratch schema where the setup creates the source
  # and the watermark state table; the reset job only drops reverse_etl_* names
  # here.
  catalog: de_dev
  schema_name: sr_poc_external
  # Column DDL the setup asset creates the source table with (the component adds
  # the identity key `rid` itself -- the key everywhere downstream). Used only
  # when the table has to be created; never applied to an existing table.
  source_columns:
    - "id BIGINT NOT NULL"
    - "value STRING"
    - "updated_at TIMESTAMP"
  # Demo seed, run as the LAST step of the setup job -- after the setup's own
  # baseline sync, so the watermark starts at the pre-seed version and it is the
  # chain's first data sync that lands these rows on the targets. {source_table}
  # is substituted with the source table name. The MERGE keeps re-runs
  # idempotent, and the trailing update + delete give every fresh setup its
  # first update and delete events.
  seed_statements:
    - |
      MERGE INTO {source_table} AS target
      USING (
        SELECT 1 AS id, 'first' AS value, current_timestamp() AS updated_at
        UNION ALL SELECT 2, 'second', current_timestamp()
        UNION ALL SELECT 3, 'third', current_timestamp()
      ) AS source
      ON target.id = source.id
      WHEN MATCHED THEN UPDATE SET target.value = source.value, target.updated_at = source.updated_at
      WHEN NOT MATCHED THEN INSERT (id, value, updated_at) VALUES (source.id, source.value, source.updated_at)
    - "UPDATE {source_table} SET value = 'second-updated', updated_at = current_timestamp() WHERE id = 2"
    - "DELETE FROM {source_table} WHERE id = 3"
