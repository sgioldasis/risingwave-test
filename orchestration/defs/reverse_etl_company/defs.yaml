# Reverse ETL of a table copy of de_dev.kaizen_wars.dim_company
# (docs/poc/REVERSE_ETL_VIEW_COPY.md). The source table is created by hand with
# CTAS, so source_columns is left unset: the setup asset only checks it exists.
type: orchestration.components.reverse_etl_cdf_demo.ReverseEtlCdfDemo

attributes:
  name: company

  # The infrastructure names, explicit (plan section 11): the watermark key, the tables,
  # the topic and the connector this sync touches. Nothing is derived from `name` -- `name`
  # only derives the Dagster object names.
  sync_name: reverse_etl_company
  source_table: reverse_etl_company_source
  state_table: reverse_etl_company_state
  kafka_topic: reverse_etl_company_topic
  connector_name: reverse_etl_company_sink
  postgres_table: reverse_etl_company_target
  risingwave_table: reverse_etl_company_target
  catalog: de_dev
  schema_name: sr_poc_external
  key_column: Company_ID
  encoding: avro
  propagate_drops: false
