# The Jobotron team's real GR job (unverified_customers_gr.ipynb) as an instance
# of the team's delta-to-kafka component (MR !166, vendored wheel): the query runs
# verbatim on the SQL warehouse and every selected customer is published as one
# JSON message (the query's columns), keyed by CustomerId, to the instance's
# Kafka topic. The query is the notebook's SQL with its tables qualified to the
# GR market's physical shard: the notebook runs the union views, but
# de.voperdb_gr holds only company 1 (verified live 2026-10-26, evidence in
# docs/poc/JOBOTRON_CONTRACT_PARITY.md) -- single-market tables turn a 29-way
# UNION scan into a seconds-class statement. The company/group filters stay as
# guards. The workspace is the literal host from the environment (this repo has
# no databricks-workspaces.yaml; the component passes a literal https:// host
# through; the host var is the repo's existing DBT_DATABRICKS_HOST, which the
# reverse-ETL env bridge reads too). dry_run defaults to true -- the first run sends nothing.

type: kaizen_dagster_delta_to_kafka.components.delta_to_kafka.DeltaToKafkaComponent

attributes:
  name: unverified_customers_gr
  asset_key_prefix: [jobotron]
  query: |
    select cusCustomerID as CustomerId, cusCompanyID as CompanyId
    from de.voperdb_gr.cCustomer
    inner join de.metadatadb.mVerificationStatus on cusVerificationStatusID = vstVerificationStatusID
    left join de.voperdb_gr.cCustomer_Group on ccgCustomerID = cusCustomerID and ccgGroupID = 1425
    where cusCreated between current_timestamp() - interval 28 days and current_timestamp() - interval 26 days
    and cusTypeID not in (2, 5, 6, 10, 11, 15)  -- Test, RISK BLOCK, UAT, UNVERIFIED BETANO-RO, UNVERIFIED STOIXIMAN-GR
    and cusCompanyID = 1  -- GML(GREECE)
    and cusStatusID = 3  -- REAL
    and vstVerifiedFL = false  -- Not verified
    and (ccgValue0 is null or ccgValue0 <> '1')
  workspace: "{{ env('DBT_DATABRICKS_HOST') }}"
  warehouse: "{{ env('DATABRICKS_WAREHOUSE_ID') }}"
  kafka_profile: openshift_kafka_connect
  topic: jobotron_unverified_customers_gr
  message:
    format: json
    key_column: CustomerId
  metadata: [processed_at, run_id]
  dry_run: true
