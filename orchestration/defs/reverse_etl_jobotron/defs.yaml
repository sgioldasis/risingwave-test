# The Jobotron producer demo (docs/poc/REVERSE_ETL_JOBOTRON.md): the RFC's upstream
# publisher as a Dagster component. The query is the RFC's example job -- "send PM to
# customers that remain unverified" -- run by DuckDB over delta-rs scans of the two
# demo tables; one Avro message per selected customer goes to its operator topic
# (jobotron_demo_gr / jobotron_demo_br), schemas in the staging Apicurio.
type: orchestration.components.reverse_etl_jobotron.JobotronProducer

attributes:
  # The RFC job identifier wrapped into every message's envelope (next to the
  # Dagster run_id) and shown in the run metadata: it tells the consumer which
  # producer job produced the message.
  job_type: kyc.unverified_pm
  # Where the two producer-owned Delta tables live. delta-rs scans them directly
  # through the service principal -- no warehouse, no DBUs, no Spark.
  catalog: de_dev
  schema_name: sr_poc_external
  # The candidate-selection query, in DuckDB dialect. `customers` and `kyc_cases`
  # are the alias names the two Delta tables are registered under in DuckDB (the
  # table names themselves are the component defaults reverse_etl_jobotron_customers
  # / reverse_etl_jobotron_kyc_cases); every column the query touches must be listed
  # in scan_columns.
  query: |
    SELECT c.customer_id, c.email, c.locale, c.operator
    FROM customers AS c
    JOIN kyc_cases AS k ON k.customer_id = c.customer_id
    WHERE k.status = 'PENDING' AND c.is_active
  # The operators this demo publishes for. Each selected customer is routed to
  # its own operator's topic (one topic and one registry subject per operator),
  # so the demo can show per-operator isolation: a customer appears only in its
  # operator's table.
  operators:
    - gr
    - br
  # The topic name per operator: the {operator} slot is filled with the row's
  # value of operator_column below, so a gr customer lands on jobotron_demo_gr
  # and a br customer on jobotron_demo_br.
  topic_template: "jobotron_demo_{operator}"
  # The Kafka record's key (serialized against the topic's -key registry
  # subject): one Avro message per selected customer, keyed by these columns.
  key_columns:
    - customer_id
  # The query column that says which operator a customer belongs to -- its value
  # fills the {operator} slot of topic_template.
  operator_column: operator
  # The columns each delta-rs scan fetches, keyed by the query's table aliases
  # (a pruning hint: day one has no predicate pushdown, so scan only what the
  # query selects -- every column the query uses must be listed here).
  scan_columns:
    customers:
      - customer_id
      - email
      - locale
      - operator
      - is_active
    kyc_cases:
      - customer_id
      - status
