# The plain-Delta trial: the same pipeline and data as the avro sync, but the source
# table is created WITHOUT UniForm (no Iceberg compat) — Change Data Feed plus
# column mapping only (column mapping is not a UniForm feature; it is what lets
# Delta take DROP COLUMN, so the drop-propagation demo works here too). It shows
# the sync is UniForm-agnostic end to end. The trade-off is visible in StarRocks:
# `reverse_etl_delta_source` does NOT appear in the databricks_uc catalog there,
# because that reads tables through UniForm's Iceberg metadata. See
# docs/poc/REVERSE_ETL_CODE_WALKTHROUGH.md and docs/poc/REVERSE_ETL_DBU_COST_NOTES.md.
type: orchestration.components.reverse_etl_cdf_demo.ReverseEtlCdfDemo

attributes:
  # The label the Dagster object names derive from (reverse_etl_delta_to_kafka, the
  # delta_setup_job / _reset_job, ...). The watermark key and the Debezium envelope prefix
  # are `sync_name` below -- changing that for an existing sync restarts it from the beginning.
  name: delta

  # The infrastructure names, explicit (plan section 11): the watermark key, the tables,
  # the topic and the connector this sync touches. Nothing is derived from `name` -- `name`
  # only derives the Dagster object names.
  sync_name: reverse_etl_delta
  source_table: reverse_etl_delta_source
  state_table: reverse_etl_delta_state
  kafka_topic: reverse_etl_delta_topic
  connector_name: reverse_etl_delta_sink
  postgres_table: reverse_etl_delta_target
  risingwave_table: reverse_etl_delta_target
  # The point of this sync (see the header): create the source as plain Delta --
  # Change Data Feed plus column mapping, no UniForm/Iceberg compat.
  uniform: false
  # Avro here too, so the registry flow is exercised against a plain-Delta
  # source (one <topic>-key and <topic>-value subject in the staging registry).
  encoding: avro
  # Same drop propagation as the other syncs (column mapping is on, so Delta
  # accepts DROP COLUMN on this source); renames propagate with data preserved.
  propagate_drops: true
  # The Databricks catalog and scratch schema where the setup creates the source
  # and the watermark state table; the reset job only drops reverse_etl_* names
  # here.
  catalog: de_dev
  schema_name: sr_poc_external
  # Column DDL the setup asset creates the source table with (the component adds
  # the identity key `rid` itself -- the key everywhere downstream). Used only
  # when the table has to be created; never applied to an existing table.
  source_columns:
    - "id BIGINT NOT NULL"
    - "description STRING"
    - "updated_at TIMESTAMP"
  # Demo seed, run as the LAST step of the setup job -- after the setup's own
  # baseline sync, so the watermark starts at the pre-seed version and it is the
  # chain's first data sync that lands these rows on the targets. {source_table}
  # is substituted with the source table name. The MERGE keeps re-runs
  # idempotent, and the trailing update + delete give every fresh setup its
  # first update and delete events.
  seed_statements:
    - |
      MERGE INTO {source_table} AS target
      USING (
        SELECT 1 AS id, 'first' AS description, current_timestamp() AS updated_at
        UNION ALL SELECT 2, 'second', current_timestamp()
        UNION ALL SELECT 3, 'third', current_timestamp()
      ) AS source
      ON target.id = source.id
      WHEN MATCHED THEN UPDATE SET target.description = source.description, target.updated_at = source.updated_at
      WHEN NOT MATCHED THEN INSERT (id, description, updated_at) VALUES (source.id, source.description, source.updated_at)
    - "UPDATE {source_table} SET description = 'second-updated', updated_at = current_timestamp() WHERE id = 2"
    - "DELETE FROM {source_table} WHERE id = 3"
