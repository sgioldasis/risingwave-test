# The plain-Delta trial: the same pipeline and data as the avro sync, but the source
# table is created WITHOUT UniForm (no Iceberg compat) — Change Data Feed plus
# column mapping only (column mapping is not a UniForm feature; it is what lets
# Delta take DROP COLUMN, so the drop-propagation demo works here too). It shows
# the sync is UniForm-agnostic end to end. The trade-off is visible in StarRocks:
# `reverse_etl_delta_source` does NOT appear in the databricks_uc catalog there,
# because that reads tables through UniForm's Iceberg metadata. See
# docs/poc/REVERSE_ETL_CODE_WALKTHROUGH.md and docs/poc/REVERSE_ETL_DBU_COST_NOTES.md.
type: orchestration.components.reverse_etl_cdf_sync.ReverseEtlCdfSync

attributes:
  name: delta
  uniform: false
  extraction: oss_spark
  encoding: avro
  # Same drop propagation as the other syncs (column mapping is on, so Delta
  # accepts DROP COLUMN on this source); renames propagate with data preserved.
  propagate_drops: true
  catalog: de_dev
  schema_name: sr_poc_external
  source_columns:
    - "id BIGINT NOT NULL"
    - "description STRING"
    - "updated_at TIMESTAMP"
  seed_statements:
    - |
      MERGE INTO {source_table} AS target
      USING (
        SELECT 1 AS id, 'first' AS description, current_timestamp() AS updated_at
        UNION ALL SELECT 2, 'second', current_timestamp()
        UNION ALL SELECT 3, 'third', current_timestamp()
      ) AS source
      ON target.id = source.id
      WHEN MATCHED THEN UPDATE SET target.description = source.description, target.updated_at = source.updated_at
      WHEN NOT MATCHED THEN INSERT (id, description, updated_at) VALUES (source.id, source.description, source.updated_at)
    - "UPDATE {source_table} SET description = 'second-updated', updated_at = current_timestamp() WHERE id = 2"
    - "DELETE FROM {source_table} WHERE id = 3"
