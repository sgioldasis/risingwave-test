# The orders-shaped sync: the same pipeline as cdf, with a different table shape
# (an extra DOUBLE `total` column) and the default JSON encoding -- the second
# table the event matrix in docs/poc/REVERSE_ETL_SPARK_FREE_FINDINGS.md was
# verified on. Every name is derived from `name`: reverse_etl_orders_source,
# reverse_etl_orders_target, reverse_etl_orders_topic, reverse_etl_orders_sink,
# reverse_etl_orders_setup_job, ...
# No `encoding` field -- the component's default is JSON with the schema
# embedded in every message (the avro and delta syncs opt into the registry's
# Avro).
type: orchestration.components.reverse_etl_cdf_demo.ReverseEtlCdfDemo

attributes:
  # The sync label every other name derives from: reverse_etl_orders_source /
  # _state / _topic / _sink, the orders_setup_job / _reset_job / make-change
  # job, and the Postgres + RisingWave target tables. It is also the watermark
  # key and the Debezium envelope prefix -- changing it on an existing sync
  # restarts that sync from the beginning.
  name: orders
  # Same drop propagation as avro (see that defs.yaml).
  propagate_drops: true
  # The Databricks catalog and scratch schema where the setup creates the source
  # and the watermark state table; the reset job only drops reverse_etl_* names
  # here.
  catalog: de_dev
  schema_name: sr_poc_external
  # Column DDL the setup asset creates the source table with (the component adds
  # the identity key `rid` itself -- the key everywhere downstream). Used only
  # when the table has to be created; never applied to an existing table.
  source_columns:
    - "id BIGINT NOT NULL"
    - "description STRING"
    - "total DOUBLE"
    - "updated_at TIMESTAMP"
  # Demo seed, run as the LAST step of the setup job -- after the setup's own
  # baseline sync, so the watermark starts at the pre-seed version and it is the
  # chain's first data sync that lands these rows on the targets. {source_table}
  # is substituted with the source table name. The MERGE keeps re-runs
  # idempotent, and the trailing update + delete give every fresh setup its
  # first update and delete events.
  seed_statements:
    - |
      MERGE INTO {source_table} AS target
      USING (
        SELECT 1 AS id, 'first order' AS description, 9.5 AS total, current_timestamp() AS updated_at
        UNION ALL SELECT 2, 'second order', 20.0, current_timestamp()
        UNION ALL SELECT 3, 'third order', 7.25, current_timestamp()
      ) AS source
      ON target.id = source.id
      WHEN MATCHED THEN UPDATE SET target.description = source.description, target.total = source.total, target.updated_at = source.updated_at
      WHEN NOT MATCHED THEN INSERT (id, description, total, updated_at) VALUES (source.id, source.description, source.total, source.updated_at)
    - "UPDATE {source_table} SET description = 'second order (updated)', total = 21.0, updated_at = current_timestamp() WHERE id = 2"
    - "DELETE FROM {source_table} WHERE id = 3"
