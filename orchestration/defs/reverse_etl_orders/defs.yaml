type: orchestration.components.reverse_etl_cdf_sync.ReverseEtlCdfSync

attributes:
  name: orders
  catalog: de_dev
  schema_name: sr_poc_external
  source_columns:
    - "id BIGINT NOT NULL"
    - "total DOUBLE"
  seed_statements:
    - |
      MERGE INTO {source_table} AS target
      USING (
        SELECT 1 AS id, 9.5 AS total
        UNION ALL SELECT 2, 20.0
        UNION ALL SELECT 3, 7.25
      ) AS source
      ON target.id = source.id
      WHEN MATCHED THEN UPDATE SET target.total = source.total
      WHEN NOT MATCHED THEN INSERT (id, total) VALUES (source.id, source.total)
    - "UPDATE {source_table} SET total = 21.0 WHERE id = 2"
    - "DELETE FROM {source_table} WHERE id = 3"
