type: orchestration.components.reverse_etl_cdf_sync.ReverseEtlCdfSync

attributes:
  name: orders
  catalog: de_dev
  schema_name: sr_poc_external
  source_columns:
    - "id BIGINT NOT NULL"
    - "description STRING"
    - "total DOUBLE"
    - "updated_at TIMESTAMP"
  seed_statements:
    - |
      MERGE INTO {source_table} AS target
      USING (
        SELECT 1 AS id, 'first order' AS description, 9.5 AS total, current_timestamp() AS updated_at
        UNION ALL SELECT 2, 'second order', 20.0, current_timestamp()
        UNION ALL SELECT 3, 'third order', 7.25, current_timestamp()
      ) AS source
      ON target.id = source.id
      WHEN MATCHED THEN UPDATE SET target.description = source.description, target.total = source.total, target.updated_at = source.updated_at
      WHEN NOT MATCHED THEN INSERT (id, description, total, updated_at) VALUES (source.id, source.description, source.total, source.updated_at)
    - "UPDATE {source_table} SET description = 'second order (updated)', total = 21.0, updated_at = current_timestamp() WHERE id = 2"
    - "DELETE FROM {source_table} WHERE id = 3"
