<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>StarRocks data flow</title>
<style>
  :root { --bg:#ffffff; --text:#1f1e1d; --muted:#5f5e5a; --line:#b4b2a9; --card:#f5f4ee; --card-border:#d3d1c7; --active:#ef9f27; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1e1d; --text:#f1efe8; --muted:#b4b2a9; --line:#5f5e5a; --card:#2c2c2a; --card-border:#444441; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  h1 { font-size:22px; font-weight:500; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .stage { background:#ffffff; border:0.5px solid var(--card-border); border-radius:12px; padding:8px; max-width:1500px; }
  svg { width:100%; height:auto; display:block; }
  .node { transition:opacity .3s; }
  .edge { transition:opacity .3s; }
  .edge.on .p { stroke-width:4; }
  .main { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; max-width:1500px; }
  @media (max-width: 1100px) { .main { grid-template-columns:minmax(0,1fr); } }
  .side { position:sticky; top:16px; }
  @media (max-width: 1100px) { .side { position:static; } }
  .caption { background:var(--card); border-radius:12px; padding:14px 16px; margin:0 0 12px; min-height:200px; }
  .caption .t { font-size:18px; font-weight:500; margin:0 0 8px; }
  .caption .d { font-size:15px; color:var(--muted); line-height:1.65; margin:0; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  button { font:inherit; font-size:14px; color:var(--text); background:transparent; border:0.5px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; }
  button:hover { background:var(--card); }
  button:focus-visible { outline:2px solid var(--active); outline-offset:2px; }
  .pos { margin-left:auto; font-size:13px; color:var(--muted); }
  ol { list-style:none; margin:20px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr)); gap:8px; max-width:1500px; }
  li { display:grid; grid-template-columns:28px 1fr; gap:4px 10px; padding:10px 12px; border:0.5px solid var(--card-border); border-radius:12px; cursor:pointer; opacity:.6; transition:opacity .3s, background .3s; }
  li:hover { opacity:.9; }
  li.on { opacity:1; background:var(--card); border:1.5px solid var(--active); }
  .num { grid-row:1 / span 2; width:24px; height:24px; border-radius:50%; border:0.5px solid var(--line); font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  li.on .num { background:var(--active); border-color:var(--active); color:#412402; font-weight:500; }
  .st { font-size:15px; font-weight:500; }
  .sd { font-size:13.5px; color:var(--muted); line-height:1.55; }
  @media (prefers-reduced-motion: reduce) { .node, .edge, li { transition:none; } }
</style>
</head>

<div class="side">
  <div class="caption"><p class="t" id="cap-t"></p><p class="d" id="cap-d"></p></div>
  <div class="controls">
    <button id="prev" aria-label="Previous step">&larr; Back</button>
    <button id="play">Pause</button>
    <button id="next" aria-label="Next step">Next &rarr;</button>
    <span id="pos" class="pos"></span>

<script>
const S = [
  { t: 'Producers write events to Kafka', d: 'The funnel producer writes page views, cart events and purchases. The wallet producer writes transactions, their reversals and separate status updates. These are the only inputs.', n: ['fprod','wprod','ftopics','wtopics'], e: ['fp','wp'] },
  { t: 'RisingWave turns funnel events into 1-minute windows', d: 'It reads the three funnel topics and keeps funnel_summary: viewers, carters and purchasers per minute and country. A window is only complete once its minute has closed plus a 5-second watermark delay, so the first row takes about 70 seconds.', n: ['ftopics','fsum'], e: ['ft'] },
  { t: 'RisingWave appends every window to Databricks', d: 'An append-only Iceberg sink writes the windows to funnel_summary_historical. A window can be written several times as it is revised, so readers keep the latest. This table lives outside the stack and survives a full teardown.', n: ['fsum','hist'], e: ['sink'] },
  { t: 'A query reaches StarRocks', d: 'The modern dashboard, Superset or any MySQL client sends SQL to the StarRocks frontend on port 9030. They know nothing about RisingWave or Databricks.', n: ['dash','superset','client','fe'], e: ['q945','q1175','q1375'] },
  { t: 'StarRocks reads the hot windows live from RisingWave', d: 'The risingwave catalog is a JDBC connection to RisingWave. Everything RisingWave currently holds is read at query time. Nothing is copied.', n: ['rwcat','fsum','view'], e: ['jdbc','cvrw'] },
  { t: 'It reads the history live from Databricks and unions the two', d: 'The databricks_uc catalog reads the Iceberg tables through the Unity Catalog REST endpoint: the windows older than RisingWave\'s oldest one, and the country names. The view dashboard_funnel_serving returns both as one answer, with no cache and no refresh schedule.', n: ['dbcat','hist','countries','view'], e: ['hist','ctry','cvdb'] },
  { t: 'An edit in Databricks shows up without any refresh', d: 'You change a country name with a plain UPDATE in Databricks. UniForm generates the Iceberg metadata a few seconds later (about 8), and because the catalog does not cache metadata, the next ordinary query sees the new name. Nobody runs anything in StarRocks.', n: ['countries','dbcat'], e: ['ctry'] },
  { t: 'A query on the raw table runs on a materialized view', d: 'The view mv_funnel_daily_country_rollup pre-aggregates the Databricks history and refreshes every 5 minutes. When a query on the raw table is one the view can answer, the planner redirects it, so EXPLAIN shows a scan of the view. Measured 10 to 35 times faster, at small volume.', n: ['dbcat','mv','fe'], e: ['cmv'] },
  { t: 'Routine Load reads Kafka straight into StarRocks tables', d: 'No RisingWave in this path. Four tables: Primary Key (upsert, plus a status-only partial update), Duplicate Key (every event kept, with a synchronous rollup), and Aggregate Key (the funnel counters summed at the storage layer).', n: ['ftopics','wtopics','rl','agg','direct','log'], e: ['rlw','rlf','rlagg','rldirect','rllog'] },
  { t: 'RisingWave also upserts wallet events into a Primary Key table', d: 'The same wallet topic goes through RisingWave, which upserts into wallet_transactions. A reversal event carries the same transaction_id, so it overwrites the original row: one row per transaction, showing its latest state.', n: ['wtopics','wsrc','pk'], e: ['wt','upsert'] },
  { t: 'Everything StarRocks stores lives in MinIO', d: 'StarRocks runs in shared-data mode: the compute node holds no table data of its own. The tables are objects in the starrocks bucket of MinIO, so compute can be added without moving data.', n: ['agg','direct','log','pk','minio'], e: ['min125','min315','min505','min695'] }
];
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let i = 0, timer = null, live = [];

const list = $('steps');
S.forEach((s, k) => {
  const li = document.createElement('li');
  li.innerHTML = '<span class="num">' + (k + 1) + '</span><span class="st"></span><span class="sd"></span>';
  li.querySelector('.st').textContent = s.t;
  li.querySelector('.sd').textContent = s.d;
  li.onclick = () => { stop(); show(k); };
  list.appendChild(li);
});

const nodes = [...document.querySelectorAll('.node')];
const edges = [...document.querySelectorAll('.edge')];
const dotLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
document.querySelector('svg').appendChild(dotLayer);

function show(k) {
  i = (k + S.length) % S.length;
  const s = S[i];
  nodes.forEach(n => { n.style.opacity = s.n.includes(n.id.slice(2)) ? 1 : 0.3; });
  edges.forEach(e => { const on = s.e.includes(e.id.slice(2)); e.classList.toggle('on', on); e.style.opacity = on ? 1 : 0.2; });
  dotLayer.innerHTML = '';
  live = s.e.map(id => {
    const path = document.querySelector('#e-' + id + ' .p');
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', 7); c.setAttribute('fill', '#ef9f27'); c.setAttribute('stroke', '#ffffff'); c.setAttribute('stroke-width', 2);
    dotLayer.appendChild(c);
    return { c, path, len: path.getTotalLength() };
  });
  [...list.children].forEach((li, n) => li.classList.toggle('on', n === i));
  $('cap-t').textContent = (i + 1) + '. ' + s.t;
  $('cap-d').textContent = s.d;
  $('pos').textContent = 'Step ' + (i + 1) + ' of ' + S.length;
}
function tick(now) {
  const p = reduce ? 1 : (now % 1600) / 1600;
  live.forEach(o => { const pt = o.path.getPointAtLength(o.len * p); o.c.setAttribute('cx', pt.x); o.c.setAttribute('cy', pt.y); });
  requestAnimationFrame(tick);
}
function start() { stop(); timer = setInterval(() => show(i + 1), 6000); $('play').textContent = 'Pause'; }
function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = 'Play'; }

$('prev').onclick = () => { stop(); show(i - 1); };
$('next').onclick = () => { stop(); show(i + 1); };
$('play').onclick = () => (timer ? stop() : start());
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); show(i + 1); }
  if (e.key === 'ArrowLeft') { stop(); show(i - 1); }
});
show(0); requestAnimationFrame(tick); start();
</script>
