[project]
name = "risingwave-test"
version = "0.1.0"
description = "Real-time E-commerce Conversion Funnel with RisingWave, dbt, and Iceberg"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka[protobuf,avro]>=2.12.2",
    "fastavro>=1.9.0",
    "grpcio-tools>=1.66.0,<1.80.0",
    "grpcio-health-checking>=1.66.2,<1.80.0",
    "dash>=3.4.0",
    "dash-bootstrap-components>=1.4.0",
    "plotly>=5.0.0",
    "pandas>=1.3.0",
    "psycopg2-binary>=2.9.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "dbt-core>=1.11.8",
    "dbt-postgres>=1.9.0",
    "dbt-risingwave>=1.11.6",
    "dbt-starrocks==1.12.2",
    "sqlalchemy>=2.0.46",
    "duckdb>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "dagster>=1.13.3",
    "dagster-dbt>=0.29.3",
    "dagster-dg-cli>=1.13.26",
    "dagster-webserver>=1.13.3",
    "marimo>=0.10.0",
    # NOTE: Spark version is gated by two jars that must match it:
    # - Delta 4.0.0 (the latest Delta release) is built for Spark 4.0 — on 4.1 every
    #   Delta read fails with ClassNotFoundException TimeAdd. Needed by the zero-DBU
    #   change-feed reader, scripts/spark_cdf_zero_dbu_prototype.py (see
    #   docs/poc/REVERSE_ETL_DBU_COST_NOTES.md).
    # - Iceberg publishes a Spark-4.0 runtime jar: iceberg-spark-runtime-4.0_2.13,
    #   staged in Dockerfile.dagster and loaded by the compaction job.
    "pyspark>=4.0.0,<4.1.0",
    # delta-rs (no JVM): the reverse-ETL syncs read the change feed, the source's
    # current version and the state table's watermark with it, in-process.
    "deltalake>=1.6.0",
    "s3fs>=2024.1.0",
    "aiohttp>=3.13.3",
    "psutil>=7.2.2",
    "azure-storage-blob>=12.20.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "trino>=0.331.0",
    "river>=0.22.0",
    "pyarrow>=24.0.0",
    "pymysql>=1.1.2",
    # reverse-ETL demo, see docs/poc/REVERSE_ETL_DRT_COMPARISON.md
    "drt-core[databricks,postgres]==1.0.0",
    "dagster-drt>=0.5.0,<0.6",
]

[tool.dagster]
module_name = "orchestration.definitions"
project_name = "realtime_funnel"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"
