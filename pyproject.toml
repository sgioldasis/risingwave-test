[project]
name = "risingwave-test"
version = "0.1.0"
description = "Real-time E-commerce Conversion Funnel with RisingWave, dbt, and Iceberg"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # The batch reverse-ETL engine (Delta change feed -> Kafka, zero DBU), ported
    # to dagster-workspace under APR-302. Vendored as a wheel (vendor/, built from
    # the dagster-workspace checkout) so the repo has NO GitLab dependency: clones,
    # CI and image builds install it offline. When the library changes, rebuild and
    # replace: cd dagster-workspace/libraries/kaizen-dagster-reverse-etl &&
    # uv build && cp dist/*.whl <this repo>/vendor/
    "kaizen-dagster-reverse-etl",
    "confluent-kafka[protobuf,avro]>=2.12.2",
    "fastavro>=1.9.0",
    "grpcio-tools>=1.66.0,<1.80.0",
    "grpcio-health-checking>=1.66.2,<1.80.0",
    "dash>=3.4.0",
    "dash-bootstrap-components>=1.4.0",
    "plotly>=5.0.0",
    "pandas>=1.3.0",
    "psycopg2-binary>=2.9.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "dbt-core>=1.11.8",
    "dbt-postgres>=1.9.0",
    "dbt-risingwave>=1.11.6",
    "dbt-starrocks==1.12.2",
    "sqlalchemy>=2.0.46",
    "duckdb>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "dagster>=1.13.3",
    "dagster-dbt>=0.29.3",
    "dagster-dg-cli>=1.13.26",
    "dagster-webserver>=1.13.3",
    "marimo>=0.10.0",
    # NOTE: Spark version is gated by the Iceberg runtime jar: Iceberg publishes
    # iceberg-spark-runtime-4.1_2.13 (staged in Dockerfile.dagster, loaded by the
    # compaction job) but no Spark-4.2 runtime yet — bump the ceiling when it does.
    # (The old Delta 4.0.0 gate is gone: the archived Spark CDF prototype provisions
    # its own delta-spark via `uv run --with` and never touches this pin.)
    "pyspark>=4.1.0,<4.2",
    # delta-rs (no JVM): the reverse-ETL syncs read the change feed, the source's
    # current version and the state table's watermark with it, in-process.
    "deltalake>=1.6.0",
    "s3fs>=2024.1.0",
    "aiohttp>=3.13.3",
    "psutil>=7.2.2",
    "azure-storage-blob>=12.20.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "trino>=0.331.0",
    "river>=0.22.0",
    "pyarrow>=24.0.0",
    "pymysql>=1.1.2",
    # reverse-ETL demo, see docs/poc/REVERSE_ETL_DRT_COMPARISON.md
    "drt-core[databricks,postgres]==1.0.0",
    "dagster-drt>=0.5.0,<0.6",
]

[tool.uv.sources]
# The vendored wheel (see the dependency comment above): a plain file in the repo,
# so uv sync --frozen never needs network access to Kaizen systems.
kaizen-dagster-reverse-etl = { path = "vendor/kaizen_dagster_reverse_etl-0.1.1-py3-none-any.whl" }

[tool.dagster]
module_name = "orchestration.definitions"
project_name = "realtime_funnel"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    # <9.2: dash 4.5's pytest plugin configures hookimpls the old way, and pytest 9.2
    # rejects that at plugin load ("Error while loading plugin pytest11") — every run
    # dies before any test. Unpin when dash ships a new-style plugin.
    "pytest>=8,<9.2",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config -m 'not live'"
# A hung fake (or a retry loop with no fake behind it) fails after this instead of hanging CI.
timeout = 60
markers = [
    "live: needs the running local stack (RisingWave, Kafka, Dagster); skipped by default, run with -m live",
]
# Warnings are errors, except these known ones from dependencies and the project's own load_defs call.
filterwarnings = [
    "error",
    "ignore:.*sqlglotrs is deprecated:DeprecationWarning",
    "ignore:.*is currently in beta:Warning",
    "ignore:.*`load_defs` is deprecated:DeprecationWarning",
    "ignore:.*`__fields__` attribute is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["orchestration/assets", "orchestration/components"]

[tool.coverage.report]
# Only the reverse-ETL code is under test; the other assets (wallet, UDFs, dashboard) would drag the number down.
include = ["orchestration/assets/reverse_etl_*.py", "orchestration/components/*.py"]
# Measured 86% on 2026-10-25; a drop of more than a couple of points fails the run (raise it as coverage improves).
fail_under = 88
show_missing = true
skip_covered = true

[tool.ruff.lint]
# Pyflakes and pycodestyle errors only: unused imports, shadowed names, undefined names.
select = ["F", "E"]
# No formatter is enforced, so long lines are not an error.
ignore = ["E501"]
