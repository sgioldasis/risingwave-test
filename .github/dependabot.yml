version: 2
updates:
  # The workflows pin actions to commit SHAs; Dependabot proposes the bumps (and keeps the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
