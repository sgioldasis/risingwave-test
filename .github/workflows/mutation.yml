name: mutation check

# Breaks the reverse-ETL code in a temporary copy, one small change at a time, and fails if a test does not notice
# (tests/mutation_check.py). It takes a few minutes, so it runs weekly and on demand rather than on every push.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run python tests/mutation_check.py
