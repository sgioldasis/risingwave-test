name: mutation check

# Breaks the reverse-ETL code in a temporary copy, one small change at a time, and fails if a test does not notice
# (tests/mutation_check.py). It takes a few minutes, so it runs weekly and on demand rather than on every push.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: uv run python tests/mutation_check.py
