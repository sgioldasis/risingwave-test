name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The unit tests need no services: the reverse-ETL code runs against fake resources.
      - run: uv sync --frozen
      - run: uv run pytest
