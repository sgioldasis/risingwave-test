slice_name: "Wallet Transactions \u2014 Point Lookup [via RisingWave sink]"
description: "Feature: RisingWave native StarRocks sink (type=upsert) into a Primary Key table. Value: streaming upserts dedupe on transaction_id — a reversal overwrites the original row, so point lookups always show the latest state. RisingWave: REQUIRED — this table is written by the RW sink. Note: the RW sink lands rows per checkpoint, while the direct-Kafka chart's Routine Load batches every 5s (the StarRocks-enforced floor) — so the [direct Kafka -> StarRocks] chart trails this one by up to ~5s at any instant. Expected pipeline latency, not missing data."
