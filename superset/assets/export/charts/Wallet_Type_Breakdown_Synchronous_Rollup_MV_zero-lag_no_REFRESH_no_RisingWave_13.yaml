slice_name: "Wallet Type Breakdown \u2014 Synchronous Rollup MV [zero-lag, no REFRESH,\
  \ no RisingWave]"
description: "Feature: synchronous (rollup) materialized view \u2014 storage-maintained\
  \ aggregate that updates in lockstep with every write; no REFRESH statement exists.\
  \ Value: aggregates with zero possible staleness and zero refresh ops; the optimizer\
  \ rewrites the GROUP BY query to the rollup transparently. RisingWave: NOT USED\
  \ \u2014 base table wallet_transactions_log is fed by Routine Load."
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 8__table
  viz_type: table
  query_mode: aggregate
  groupby:
  - type
  metrics:
  - expressionType: SIMPLE
    column:
      column_name: amount
    aggregate: SUM
    label: total_amount
    d3format: ',.2f'
  - expressionType: SIMPLE
    column:
      column_name: transaction_id
    aggregate: COUNT
    label: event_count
    d3format: ',d'
  - expressionType: SIMPLE
    column:
      column_name: event_time
    aggregate: MAX
    label: last_event_time
  adhoc_filters: []
  row_limit: 100
  server_pagination: false
  time_range: No filter
  annotation_layers: []
  comparison_type: values
  column_config:
    total_amount:
      d3NumberFormat: ',.2f'
    event_count:
      d3NumberFormat: ',d'
    last_event_time:
      columnWidth: 150
