slice_name: "Funnel Over Time (Cached) \u2014 Last Hour [no RisingWave]"
description: "Feature: async MV + live-branch union with a cutoff predicate, windowed\
  \ to the last hour. Value: last-hour queries pay only the hot-path cost (~1.3s)\
  \ \u2014 the dead MV branch is free to skip here, the mirror image of the Zero-Copy\
  \ chart. RisingWave: REQUIRED for the window to be live."
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  adhoc_filters:
  - clause: WHERE
    comparator: '1 hour ago : now'
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: window_start
  annotation_layers: []
  datasource: 12__table
  granularity_sqla: window_start
  groupby: []
  metrics:
  - sum__viewers
  - sum__carters
  - sum__purchasers
  order_desc: false
  rich_tooltip: true
  row_limit: 10000
  show_legend: true
  time_range: '1 hour ago : now'
  viz_type: echarts_timeseries_line
  x_axis:
    sqlExpression: convert_tz(window_start, 'UTC', 'Europe/Athens')
    expressionType: SQL
    label: window_start_local
    columnType: BASE_AXIS
  x_axis_time_format: '%H:%M'
  y_axis_format: SMART_NUMBER
query_context: null
cache_timeout: null
