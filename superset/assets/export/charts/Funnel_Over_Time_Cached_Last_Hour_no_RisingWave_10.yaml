slice_name: "Funnel Over Time (Cached) — Last Hour [no RisingWave]"
description: "Feature: async MV + Direct-from-Kafka union with a cutoff predicate, windowed to the last hour. Value: fast last-hour queries over data StarRocks owns itself — no external catalog touched at query time, so it keeps working with the RisingWave containers stopped (verified live 2026-11-14). RisingWave: NOT USED at query time."
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  datasource: 12__table
  viz_type: echarts_timeseries_line
  groupby: []
  metrics:
  - sum__viewers
  - sum__carters
  - sum__purchasers
  granularity_sqla: window_start
  time_range: '1 hour ago : now'
  adhoc_filters:
  - clause: WHERE
    subject: window_start
    operator: TEMPORAL_RANGE
    comparator: '1 hour ago : now'
    expressionType: SIMPLE
  order_desc: false
  x_axis:
    sqlExpression: convert_tz(window_start, 'UTC', 'Europe/Athens')
    expressionType: SQL
    label: window_start_local
    columnType: BASE_AXIS
  x_axis_time_format: '%H:%M'
  y_axis_format: SMART_NUMBER
  rich_tooltip: true
  show_legend: true
  row_limit: 10000
  annotation_layers: []
query_context: null
cache_timeout: null
