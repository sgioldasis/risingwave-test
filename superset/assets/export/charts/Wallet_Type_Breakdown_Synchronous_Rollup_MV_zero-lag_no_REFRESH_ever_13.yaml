slice_name: "Wallet Type Breakdown — Synchronous Rollup MV [zero-lag, no REFRESH, no RisingWave]"
description: "Feature: synchronous (rollup) materialized view — storage-maintained aggregate that updates in lockstep with every write; no REFRESH statement exists. Value: aggregates with zero possible staleness and zero refresh ops; the optimizer rewrites the GROUP BY query to the rollup transparently. RisingWave: NOT USED — base table wallet_transactions_log is fed by Routine Load."
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 8__table
  viz_type: table
  query_mode: aggregate
  groupby:
  - type
  metrics:
  - expressionType: SIMPLE
    column:
      column_name: amount
    aggregate: SUM
    label: total_amount
    d3format: ',.2f'
  - expressionType: SIMPLE
    column:
      column_name: transaction_id
    aggregate: COUNT
    label: event_count
    d3format: ',d'
  adhoc_filters: []
  row_limit: 100
  server_pagination: false
  order_by_cols: []
  time_range: No filter
  annotation_layers: []
query_context: null
cache_timeout: null
