slice_name: "Daily Totals (Cached) — All History [no RisingWave]"
description: "Feature: asynchronous materialized view (REFRESH MANUAL) over Databricks Iceberg history, UNIONed with StarRocks's own Direct-from-Kafka rows by a cutoff predicate. Value: fast all-history view that never goes fully blank — and no external catalog is touched at query time, so it keeps working with the RisingWave containers stopped (verified live 2026-11-14). RisingWave: NOT USED at query time — it only matters upstream, feeding the Databricks sink the MV's next refresh picks up."
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 12__table
  viz_type: table
  query_mode: aggregate
  groupby:
  - label: day
    sqlExpression: DATE(convert_tz(window_start, 'UTC', 'Europe/Athens'))
    expressionType: SQL
  metrics:
  - sum__viewers
  - sum__carters
  - sum__purchasers
  adhoc_filters: []
  row_limit: 1000
  time_range: No filter
  timeseries_limit_metric:
