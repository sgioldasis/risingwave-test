    sqlExpression: DATE(convert_tz(window_start, 'UTC', 'Europe/Athens'))
    expressionType: SQL
  order_desc: true
  table_timestamp_format: '%Y-%m-%d'
  show_cell_bars: true
  color_pn: true
  annotation_layers: []
query_context: null
cache_timeout: 0
