slice_name: "Daily Totals (Cached) \u2014 All History [no RisingWave]"
description: "Feature: asynchronous materialized view (REFRESH MANUAL) over Databricks\
  \ Iceberg history, UNIONed with the live RisingWave branch by a cutoff predicate.\
  \ Value: fast all-history view (~1.3s) that never goes fully blank; RW hot data\
  \ overlays the frozen MV snapshot. RisingWave: REQUIRED for freshness \u2014 without\
  \ RW running the chart shows only the MV's last-rebuild snapshot (staleness invisible\
  \ from the chart)."
