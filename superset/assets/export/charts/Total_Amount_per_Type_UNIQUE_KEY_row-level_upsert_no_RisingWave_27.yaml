slice_name: "Total Amount per Type — UNIQUE KEY [row-level upsert, no RisingWave]"
description: "Feature: UNIQUE KEY table model — the fourth model (the Wallet dashboard shows DUPLICATE / AGGREGATE / PRIMARY KEY). Same per-key upsert semantics as PRIMARY KEY, whole-row REPLACE: an INSERT re-writing a key replaces the entire row, no partial-column update. Per-type totals refreshed every minute by INSERT-SELECT from the wallet table; compare the AGGREGATE KEY twin on the Wallet dashboard (incremental SUM at ingest vs full-row upsert at refresh). RisingWave: NOT USED."
