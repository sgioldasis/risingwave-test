slice_name: "Daily Totals (Live) \u2014 All History [RisingWave + Databricks]"
description: "Feature: federated external catalogs \u2014 one view UNION ALLs a JDBC\
  \ catalog (RisingWave over Postgres wire) with the Iceberg REST catalog (Databricks\
  \ UC). Value: one SQL surface over streaming-hot rows and lake-cold history with\
  \ zero data movement. RisingWave: REQUIRED \u2014 the hot branch reads risingwave.public.funnel_summary\
  \ live; when RW is empty the Databricks branch serves everything."
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 4__table
  viz_type: table
  query_mode: aggregate
  groupby:
  - sqlExpression: DATE(convert_tz(window_start, 'UTC', 'Europe/Athens'))
    expressionType: SQL
    label: day
  metrics:
