slice_name: "Funnel Over Time (Live) \u2014 Last Hour [RisingWave]"
description: "Feature: same federated UNION view as Daily Totals (Live) \u2014 shown\
  \ deliberately for its cost profile. Value: honest benchmark \u2014 for a last-hour\
  \ window the Databricks branch contributes zero rows yet StarRocks still authenticates\
  \ and reads Iceberg metadata on every query (~5s); this overhead is what motivates\
  \ the Cached variant. RisingWave: REQUIRED (+ Databricks catalog reachable)."
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  adhoc_filters:
  - clause: WHERE
    comparator: '1 hour ago : now'
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: window_start
  annotation_layers: []
  datasource: 4__table
  granularity_sqla: window_start
  groupby: []
  metrics:
  - sum__viewers
  - sum__carters
  - sum__purchasers
  order_desc: false
  rich_tooltip: true
  row_limit: 10000
  show_legend: true
  time_range: '1 hour ago : now'
  viz_type: echarts_timeseries_line
  x_axis:
    sqlExpression: convert_tz(window_start, 'UTC', 'Europe/Athens')
    expressionType: SQL
    label: window_start_local
    columnType: BASE_AXIS
  x_axis_time_format: '%H:%M'
  y_axis_format: SMART_NUMBER
query_context: null
cache_timeout: null
