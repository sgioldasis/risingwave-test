slice_name: "Funnel Over Time (Hot-Only, Direct) \u2014 Last Hour [Routine Load]"
description: "Feature: Routine Load (Kafka-to-StarRocks native ingestion) + a plain\
  \ VIEW computing the 1-minute funnel windows at query time. Value: ~5s end-to-end\
  \ freshness with no stream processor in the loop \u2014 proves the hot path works\
  \ without RisingWave (right side of the side-by-side). RisingWave: NOT USED \u2014\
  \ raw page_views/cart_events/purchases topics read directly."
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  adhoc_filters:
  - clause: WHERE
    comparator: '1 hour ago : now'
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: window_start
  annotation_layers: []
  datasource: 11__table
  granularity_sqla: window_start
  groupby: []
  metrics:
  - sum__viewers
  - sum__carters
  - sum__purchasers
  order_desc: false
  rich_tooltip: true
  row_limit: 10000
  show_legend: true
  time_range: '1 hour ago : now'
  viz_type: echarts_timeseries_line
  x_axis:
    sqlExpression: convert_tz(window_start, 'UTC', 'Europe/Athens')
    expressionType: SQL
    label: window_start_local
    columnType: BASE_AXIS
  x_axis_time_format: '%H:%M'
  y_axis_format: SMART_NUMBER
query_context: null
cache_timeout: 0
