slice_name: "Funnel Over Time (Hot-Only, Direct-from-Kafka) — Last Hour [Routine Load, no RisingWave]"
description: "Feature: Routine Load (Kafka-to-StarRocks native ingestion) + a plain VIEW computing the 1-minute funnel windows at query time. Value: ~5s end-to-end freshness with no stream processor in the loop — proves the hot path works without RisingWave (right side of the side-by-side). RisingWave: NOT USED — raw page_views/cart_events/purchases topics read directly."
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  datasource: 11__table
  viz_type: echarts_timeseries_line
  groupby: []
  metrics:
  - sum__viewers
  - sum__carters
  - sum__purchasers
  granularity_sqla: window_start
  time_range: '1 hour ago : now'
  adhoc_filters:
  - clause: WHERE
    subject: window_start
    operator: TEMPORAL_RANGE
    comparator: '1 hour ago : now'
    expressionType: SIMPLE
  order_desc: false
  x_axis:
    sqlExpression: convert_tz(window_start, 'UTC', 'Europe/Athens')
    expressionType: SQL
    label: window_start_local
    columnType: BASE_AXIS
  x_axis_time_format: '%H:%M'
  y_axis_format: SMART_NUMBER
  rich_tooltip: true
  show_legend: true
  row_limit: 10000
  annotation_layers: []
query_context: null
cache_timeout: 0
