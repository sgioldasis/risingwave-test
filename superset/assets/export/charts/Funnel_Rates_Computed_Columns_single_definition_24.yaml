slice_name: "Funnel Rates — defined once (computed columns)"
description: "Feature: computed columns — view_to_cart_rate / cart_to_buy_rate are\
  \ defined once on funnel_window_stats (rate AS round(carters / nullif(viewers, 0),\
  \ 2)), auto-derived on every upsert. Value: every consumer reads the table's own\
  \ column instead of re-deriving the expression in view/MV/query SQL — zero drift.\
  \ Refreshed by the funnel_window_stats_refresh task (1-min upsert)."
