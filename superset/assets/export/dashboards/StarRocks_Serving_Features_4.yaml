      code: "### ✨ Also in this feature set (SQL / script demos)\n- **Stream Load**\
        \ -- the third ingestion path (next to Routine Load and external-engine\
        \ writes): `bin/3_starrocks_stream_load_demo.sh` POSTs a JSON batch to the\
        \ FE's `_stream_load` endpoint with an idempotent label, then shows the landed\
        \ rows.\n- **Lake scan data cache** -- `bin/5_starrocks_lake_cache_benchmark.sh`\
        \ times the Rewrite-OFF Iceberg query cold vs warm on the same connection\
        \ (EXPLAIN ANALYZE), quantifying what the block cache buys after the 300s\
        \ UC metadata cache goes stale.\n- **Why not vector search / native CDC /\
        \ tiered storage here:** vector search needs an embedding producer this stack\
        \ doesn't have; native CDC is new infrastructure (Flink/CDC connector) duplicating\
        \ the reverse-ETL demo; tiered storage would force a shared-data reconfiguration\
        \ of the live cluster. All three are documented as out of scope in `docs/SR_POC_SERVING_FEATURES_DEMO.md`.\n"
