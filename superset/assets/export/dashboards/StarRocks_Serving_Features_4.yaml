      code: "### ✨ Workload groups -- dashboard queries isolated from refresh\
        \ traffic\n- **At a glance:** [resource groups](https://docs.starrocks.io/docs/sql-reference/sql-statements/cluster-management/resource_group/CREATE_RESOURCE_GROUP/)\
        \ partition the cluster's CPU/memory between workloads. This stack already\
        \ runs `default_mv_wg` (cpu_weight 1) for MV-refresh tasks and `default_wg`\
        \ (100) for everything else; the missing piece was a dedicated slice for\
        \ BI traffic.\n- **What was built:** `rg_superset_demo` (cpu_weight 80, mem_limit\
        \ 80%) with a classifier `TO (USER='superset_demo')` -- every query this\
        \ dashboard issues runs inside the group, so a dashboard render can't be\
        \ starved by MV-refresh rebuilds (the 20-46s refresh jams documented in\
        \ `docs/SR_POC_QUERY_REWRITE_DEMO.md`). Check `SHOW RESOURCE GROUPS ALL`\
        \ -- the classifier shows up on the group row.\n- **Honest scope note (verified\
        \ live 2026-11-16):** the query-queue half of workload groups (max_concurrency\
        \ / max_queue_size / queue_timeout) is NOT available on this shared-nothing\
        \ 4.1.7 build -- every queue property is rejected as 'Unknown property'\
        \ even with `enable_group_level_query_queue=true`. Weight isolation + classifier\
        \ pinning is what ships here; queueing needs shared-data/CN.\n"
