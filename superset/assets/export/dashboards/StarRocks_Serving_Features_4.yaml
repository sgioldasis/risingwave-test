      code: "### ✨ Generated (computed) columns -- one definition, zero drift\n\
        - **At a glance:** [generated columns](https://docs.starrocks.io/docs/sql-reference/sql-statements/generated_columns/)\
        \ define a derived value ONCE at the table -- `view_to_cart_rate AS round(carters\
        \ / nullif(viewers, 0), 2)` on `funnel_window_stats` -- and StarRocks derives\
        \ it automatically on every write. The chart below reads the table's own\
        \ columns; no consumer re-derives the expression.\n- **The problem they solve:**\
        \ this repo carried the identical `round(carters / nullif(viewers, 0), 2)`\
        \ expression in a VIEW (funnel_summary_direct), in dashboard SQL, and in\
        \ demo queries -- three places to drift when someone tunes the rounding or\
        \ the zero-guard in one and not the others.\n- **Mechanics here:** the 1-minute\
        \ scheduled task `funnel_window_stats_refresh` (SUBMIT TASK, recreated by\
        \ the starrocks_feature_demo_setup asset) upserts every 1-minute window into\
        \ the PRIMARY KEY table -- re-inserting is idempotent, and the INSERT lists\
        \ only the base columns (the rates are never written, always derived).\n"
