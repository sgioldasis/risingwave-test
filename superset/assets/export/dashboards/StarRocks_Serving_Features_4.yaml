      code: "### ✨ StarRocks serving features -- the ones the other dashboards\
        \ don't show\n- **Every chart on this dashboard connects to StarRocks as\
        \ user `superset_demo`** -- a SELECT-only credential (empty password, tables\
        \ only) whose resource-group classifier pins its queries to `rg_superset_demo`\
        \ (cpu_weight 80 vs `default_wg` 100 and `default_mv_wg` 1). The whole dashboard\
        \ physically runs inside its own workload group -- see the isolation section\
        \ below.\n- Companion doc with the full build/verification log: `docs/SR_POC_SERVING_FEATURES_DEMO.md`.\n"
