      code: "### ✨ ASOF JOIN -- nearest-timestamp lookup\n- **At a glance:** [ASOF\
        \ JOIN](https://docs.starrocks.io/docs/sql-reference/sql-statements/table_bucket_part_index/SELECT/SELECT_JOIN/)\
        \ matches each row to the closest row on the other side at-or-before its\
        \ timestamp -- here, each page view picks up the most recent risk-score publication\
        \ for its country (`ON e.country = c.country AND e.event_time >= c.ts`).\
        \ The classic pattern (match each bet/trade to the latest quote) without\
        \ window functions or range predicates.\n- **The join is real:** country\
        \ comes from `dim_users` (same 'country becomes data' join as the rewrite\
        \ demo), and the score feed `country_scores` is a per-country hourly publication\
        \ history -- the event uses whatever was published *as of the event*, not\
        \ the latest value.\n- **Syntax gotchas, confirmed live on 4.1.7:** the ON\
        \ clause needs a REAL-column equi predicate plus the temporal >= (a constant/aliased\
        \ equi through a subquery, or a subquery-derived right side, is rejected\
        \ as a 'correlated condition'), the temporal columns must be BIGINT/DATE/DATETIME\
        \ (not strings), and ASOF composes fine after a regular join (page_views\
        \ ⋈ dim_users feeds it here).\n"
