    - ROW-COMPAREB
    meta:
      width: 12
      height: 61
      code: '**Add-on comparison (2026-09-12, latency re-measured 2026-09-13):** the two tables above hold the same live `wallet_transactions` Kafka topic, ingested two different ways -- motivated by the internal PAM Operational Query Layer proposal, which specifically argues for StarRocks to serve upsert-heavy financial reads *directly from Kafka*, not via an intermediate stream processor.


        - **Left (via RisingWave sink):** Kafka -> RisingWave source -> RisingWave upsert sink -> StarRocks. Tuned this session with `commit_checkpoint_interval = 1` (see `dbt/models/sink_wallet_transactions_to_starrocks.sql`), cutting lag from ~24-40s at the sink''s decoupled default (`commit_checkpoint_interval = 10`).

        - **Right (direct Kafka -> StarRocks):** a native StarRocks Routine Load job (`wallet_direct_kafka_load`, see `orchestration/assets/wallet_direct_kafka_setup.py`) reads the same topic straight into a second Primary Key table, no RisingWave involved at all.


        **Measured rigorously (12 samples, 3s apart, 2026-09-13) -- no consistent winner:**


        | | avg lag | min | max |

        |---|---|---|---|

        | RisingWave-mediated | 2.97s | 1.3s | 5.3s |

        | Direct Kafka Routine Load | 3.36s | 0.7s | 5.7s |


        Both hover in the same few-seconds band; which one looks "ahead" at any single glance just depends on where you catch each path''s own batch cycle (RisingWave commits every checkpoint, ~4s in this project''s tuned config; the Routine Load job''s `max_batch_interval` is 5s but lands bursty, not on a strict clock). An earlier version of this note claimed the direct path was consistently faster (~1-2s vs ~2-3s) based on a couple of single-point checks -- that wasn''t rigorous and the corrected, repeated measurement doesn''t support it.


        Both confirmed upsert-correct: `COUNT(*) == COUNT(DISTINCT transaction_id)` holds on both tables, so a reversal event overwrites its original row either way -- the comparison is purely about architecture, not correctness or a clear latency win.


        **Tradeoff:** the direct path is simpler -- one fewer moving part, one fewer thing that can lag or fail -- but RisingWave in the loop brings stream processing (joins, windowing, dedup, transformation) that a passthrough-only pipeline like this one doesn''t need; for a pipeline that DID need those, the direct-Kafka path wouldn''t be an option at all.

        '
