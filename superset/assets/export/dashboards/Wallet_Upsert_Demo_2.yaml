      code: '**Add-on comparison (2026-09-12): partial-column update, no RisingWave.**
        The table above is filtered to `status = ''flagged''` on `wallet_transactions_direct_kafka`
        -- every row there was written by an *independent* StarRocks Routine Load
        job (`wallet_status_update_load`) reading a *separate* Kafka topic (`wallet_status_updates`)
        that carries only `{transaction_id, status}`, loaded with `"partial_update"
        = "true"`.


        That writer never sees `account_id`/`type`/`amount`/`event_time` at all --
        yet the row above still has all of them, exactly as originally written by
        the *other* Routine Load job that ingests full transactions. This is a genuinely
        different write pattern from the upsert demo above: not "a new event replaces
        the whole row," but "two independent writers, each with partial knowledge
        of a row, converge on the same table" -- something a Unique Key table''s whole-row-replace
        model can''t express at all.


        See `orchestration/assets/wallet_direct_kafka_setup.py` and `docs/SR_POC_WALLET_UPSERT_DEMO.md`.'
