    - ROW-SYNCMV-MD
    meta:
      width: 12
      height: 28
      code: '### ✨ Synchronous rollup MV -- always-current aggregates

        - **At a glance:** a [synchronous (rollup) materialized view](https://docs.starrocks.io/docs/using_starrocks/Materialized_view-single_table/) -- a pre-aggregated index on one base table that StarRocks updates in lockstep with every write, so it never needs a REFRESH and can never go stale. Contrast with an [asynchronous MV](https://docs.starrocks.io/docs/using_starrocks/async_mv/Materialized_view/): a separate table populated by a background REFRESH job, which can join many tables and use any aggregate function -- but is only as fresh as its last refresh. Sync MVs trade that flexibility for zero lag on a single table.

        - **Why here:** `wallet_transactions_log` keeps every event as its own row; the rollup maintains type-level totals continuously, so the breakdown chart reads the rollup instead of scanning the log.

        - **Value:** aggregates are always current -- zero REFRESH operations, zero staleness. An async MV would need a refresh schedule (stale windows); recomputing the GROUP BY at query time gets slower as the log grows.

        - **RisingWave:** NOT USED -- the log table and its rollup MV are fed straight from Kafka by Routine Load. Synchronous MVs only exist inside StarRocks, so no external streaming engine could provide this anyway.

        '
