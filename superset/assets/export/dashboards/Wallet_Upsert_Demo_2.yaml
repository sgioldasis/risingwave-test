    meta:
      width: 12
      height: 30
      code: '**Demo:** StarRocks Primary Key table upsert visibility, motivated by
        an internal PAM Operational Query Layer proposal that argues for StarRocks
        to serve upsert-heavy financial reads (reversals/corrections) directly from
        Kafka. See `docs/SR_POC_WALLET_UPSERT_DEMO.md`.


        **Pipeline:** `scripts/wallet_producer.py` emits a synthetic transaction,
        then ~5s later a reversal for the *same* `transaction_id` -> RisingWave source
        (`src_wallet_transactions`) -> RisingWave''s native StarRocks sink in upsert
        mode (`sink_wallet_transactions_to_starrocks`) -> a genuine StarRocks Primary
        Key table (`wallet_transactions`), not a view/MV.


        **Confirmed live (2026-09-12):** `count(*) == count(DISTINCT transaction_id)`
        -- every reversed transaction produced 2 Kafka events, but the table holds
        exactly 1 row per `transaction_id`, correctly showing the *latest* (reversed)
        state, not a duplicate. A single point lookup by `transaction_id` took ~90ms
        including `docker exec` overhead.


        **Real issues found and fixed while building this** (see the doc for full
        detail): StarRocks''s CTAS always coerces DOUBLE/literal-float results to
        `decimal(38,9)` regardless of CAST, so `amount` is modeled as `decimal` end-to-end
        (arguably more correct for money anyway); RisingWave''s StarRocks sink flatly
        rejects `TIMESTAMP WITH TIME ZONE`, so `event_time` is cast to plain `TIMESTAMP`
        before the sink; `starrocks.mysqlport`/`starrocks.httpport` (one word) are
        the correct sink property names, not `query_port`/`http_port`.


        All data is synthetic (`scripts/wallet_producer.py`) -- no real accounts,
        amounts, or payment data anywhere in this pipeline.'
