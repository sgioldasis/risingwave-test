      code: '### ✨ AGGREGATE KEY table -- the table is the running total

        - **At a glance:** the [AGGREGATE KEY table model](https://docs.starrocks.io/docs/table_design/table_types/aggregate_table/) -- aggregation maintained by the storage engine itself: rows arriving with an already-seen key are merged via each column''s aggregate function.

        - **Why here:** a Routine Load job writes one row per wallet type; repeated writes for the same type merge on the spot, so the table itself IS the running total.

        - **Value:** running totals with no MV, no query-time GROUP BY, no refresh -- `SELECT *` returns the merged answer. (Deliberate contrast: it sums raw events, so a reversal still counts toward its type; the Primary Key table nets reversals out.)

        - **RisingWave:** NOT USED -- Routine Load feeds the AGGREGATE table straight from the raw topics; the storage engine, not a stream processor, does the aggregating.

        '
