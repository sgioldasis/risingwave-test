      height: 37
      code: "**Add-on comparison (2026-09-13): AGGREGATE KEY table, storage-level incremental aggregation.** The table above (`wallet_type_totals_agg`) is a **third** way this project answers \"total amount / event count per type\", each via a structurally different mechanism:\n\n1. **Ad-hoc aggregate query** (the bar charts below) --\n   `SELECT type, SUM(amount) ... FROM wallet_transactions GROUP BY type`, computed at query time over the Primary Key table.\n2. **Synchronous rollup MV** (above) -- a query-time *rewrite* to a pre-merged rollup index over the Duplicate Key log table.\n3. **AGGREGATE KEY table (here)** -- the table itself IS the answer. On ingest, a Routine Load job (`wallet_type_totals_agg_load`) writes one row per `type`; when a second row for the same key arrives, StarRocks merges it via each column's own aggregate function -- `SUM` for `total_amount`/`event_count`, `REPLACE` (keep only the latest value) for `last_event_time` -- confirmed live: two events summed correctly with no MV, no `GROUP BY`, not even a compaction wait: `SELECT *`/`COUNT(*)` reflect the merged, one-row-per-key state immediately.\n\n**Numbers won't match the other two exactly, and that's expected, not a bug:** this table sums every *raw* event by its own `type` -- a `bet` that later gets reversed still counts toward `bet`'s gross total here, with its `reversal` counted separately. The Primary Key table's aggregate instead nets reversals out (upsert collapses each `transaction_id` to its latest state, moving it out of its original `type` bucket entirely). Same-ish question, genuinely different answer depending on which table you ask.\n"
