    meta:
      width: 12
      height: 30
      code: '**Add-on comparison (2026-09-13): synchronous (rollup) materialized view, no RisingWave.** The table above reads `wallet_transactions_log` -- a **Duplicate Key** table (keeps every event as a separate row, no upsert -- an original transaction and its reversal both land here, unlike the two Primary Key tables above which collapse them) fed by yet another StarRocks Routine Load job on the same `wallet_transactions` topic.


        Grouped over it is `mv_wallet_type_rollup`, a **synchronous** materialized view -- unlike every other MV in this project (`mv_unified_funnel_summary`, `mv_funnel_daily_country_rollup`, `mv_iceberg_countries_cache`), which are all *asynchronous* and need an explicit `REFRESH` to pick up new data, this one is maintained directly by the storage engine and updates in lockstep with every write -- **there is no `REFRESH` statement for it, it isn''t possible to issue one.** Confirmed via `EXPLAIN`: querying `wallet_transactions_log GROUP BY type` directly shows `rollup: mv_wallet_type_rollup` in the plan, same transparent redirection as the async query-rewrite demo, but with zero possible staleness.


        See `orchestration/assets/wallet_sync_mv_setup.py` and `docs/SR_POC_WALLET_UPSERT_DEMO.md` for two real StarRocks gotchas found while building this (`COUNT(*)` rejected by sync MV creation, `IF NOT EXISTS` not actually idempotent for sync MVs).

        '
