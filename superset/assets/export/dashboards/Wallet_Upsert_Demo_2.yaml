    meta:
      width: 12
      height: 34
      code: '### ✨ Query-time GROUP BY vs storage-maintained AGGREGATE KEY

        - **At a glance:** the same two questions -- event count and total amount per wallet type -- each answered by a different StarRocks mechanism: the left pair runs a query-time [GROUP BY](https://docs.starrocks.io/docs/sql-reference/sql-statements/table_bucket_part_index/SELECT/SELECT_GROUP_BY/) over the [Primary Key table](https://docs.starrocks.io/docs/table_design/table_types/primary_key_table/) (aggregation computed when you query); the right pair reads from the [AGGREGATE KEY table model](https://docs.starrocks.io/docs/table_design/table_types/aggregate_table/) (aggregation pre-merged at ingestion).

        - **Why here:** the left pair runs a query-time GROUP BY over the Primary Key table (via the RisingWave sink) -- the baseline any SQL store gives you. The right pair reads the same numbers from the AGGREGATE KEY table that merged them at ingestion (Routine Load, no RisingWave).

        - **Value:** the charts look near-identical; the mechanisms are not. GROUP BY re-aggregates the table on every load; AGGREGATE KEY serves a pre-merged answer -- this row is the A/B comparison of where aggregation should live.

        - **RisingWave:** left pair REQUIRED -- it streams wallet events into the Primary Key table that the GROUP BY reads. Right pair NOT USED -- the AGGREGATE table is fed by Routine Load directly, so this comparison also isolates what RisingWave does (stream into StarRocks) from what StarRocks does (store and merge).

        '
