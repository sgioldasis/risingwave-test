      code: '### ✨ Partial column update -- independent writers, one row

        - **At a glance:** [partial column update](https://docs.starrocks.io/docs/loading/Load_to_Primary_Key_tables/) -- one load can update only some columns of a Primary Key table row; the rest keep their values.

        - **Why here:** a flagging service marks suspicious transactions by writing just the `status` column of `wallet_transactions_direct_kafka` -- it never sees, and must not overwrite, the rest of the row.

        - **Value:** several independent systems can update the same row safely, with no read-modify-write cycles and no clobbered columns -- no coordination service needed.

        - **RisingWave:** NOT USED -- nothing in this path needs a stream processor: the flagged rows land via Routine Load and the status-only writer is a StarRocks load job. The chart deliberately shows StarRocks handling multi-writer updates on its own.

        '
