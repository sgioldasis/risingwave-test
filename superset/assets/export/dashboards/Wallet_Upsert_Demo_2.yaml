    meta:
      width: 12
      height: 40
      code: '**Add-on comparison (2026-09-12):** the two tables above hold the same
        live `wallet_transactions` Kafka topic, ingested two different ways -- motivated
        by the internal PAM Operational Query Layer proposal, which specifically argues
        for StarRocks to serve upsert-heavy financial reads *directly from Kafka*,
        not via an intermediate stream processor.


        - **Left (via RisingWave sink):** Kafka -> RisingWave source -> RisingWave
        upsert sink -> StarRocks. Tuned this session with `commit_checkpoint_interval
        = 1` (see `dbt/models/sink_wallet_transactions_to_starrocks.sql`), measured
        lag **~2-3s** (down from ~24-40s at the sink''s decoupled default of `commit_checkpoint_interval
        = 10`).

        - **Right (direct Kafka -> StarRocks):** a native StarRocks Routine Load job
        (`wallet_direct_kafka_load`, see `orchestration/assets/wallet_direct_kafka_setup.py`)
        reads the same topic straight into a second Primary Key table, no RisingWave
        involved at all. Measured lag **~1-2s**, floored by `max_batch_interval`''s
        hard minimum of 5s in configuration but observed lower in practice since the
        batch fires as soon as enough data accumulates, not only at the interval boundary.


        Both confirmed upsert-correct: `COUNT(*) == COUNT(DISTINCT transaction_id)`
        holds on both tables, so a reversal event overwrites its original row either
        way -- the comparison is purely about latency and architectural simplicity,
        not correctness.


        **Tradeoff:** the direct path is simpler and currently lower-latency for this
        narrow case, but RisingWave in the loop brings stream processing (joins, windowing,
        dedup, transformation) that a passthrough-only pipeline like this one doesn''t
        need -- for a pipeline that DID need those, the direct-Kafka path wouldn''t
        be an option at all.'
