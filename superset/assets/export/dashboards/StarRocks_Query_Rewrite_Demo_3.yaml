      code: '### ✨ Transparent query rewrite -- lake data at MV speed

        - **At a glance:** [transparent query rewrite](https://docs.starrocks.io/docs/using_starrocks/async_mv/use_cases/query_rewrite_with_materialized_views/) -- the optimizer silently redirects a base-table query to a matching async MV holding pre-computed results.

        - **Why here:** daily country viewers over Databricks Iceberg history: the MV computes the rollup once at REFRESH, then every identical dashboard query hits it instead of scanning the lake.

        - **Value:** ~10-100x faster dashboards (~0.1s vs a multi-second raw Iceberg scan) with zero query or dashboard changes -- the Rewrite OFF chart runs the same query without the MV.

        - **RisingWave:** NOT USED on either side -- both charts read Databricks Iceberg history through StarRocks catalogs; this demo is purely about StarRocks'' own optimizer, with no streaming layer in the loop.

        '
