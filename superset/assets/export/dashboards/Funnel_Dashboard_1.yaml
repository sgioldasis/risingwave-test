      code: '### ✨ Federated catalogs -- one view over hot + cold

        - **At a glance:** [federated external catalogs](https://docs.starrocks.io/docs/data_source/catalog/) -- one view UNION ALLs a JDBC catalog (RisingWave) with the Iceberg REST catalog (Databricks UC).

        - **Why here:** one SQL surface spanning streaming-hot rows and lake-cold history, so a single chart covers both with no ETL in between.

        - **Value:** zero data movement, one query -- but every load re-fetches external metadata (~5s), which is exactly the overhead the cached pair above removes.

        - **RisingWave:** REQUIRED -- it supplies the hot branch of the UNION (its funnel materialized views, read live over JDBC); Databricks UC supplies the cold branch. RW down = hot data silently missing from the charts.

        '
