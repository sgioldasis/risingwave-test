    - ROOT_ID
    - GRID_ID
    - ROW-8B
    meta:
      width: 12
      height: 32
      code: '**Side-by-side comparison (2026-11-13):** two charts, same 1-minute funnel aggregation, two independent ingestion paths into StarRocks.


        - **Left — via RisingWave:** `risingwave.public.funnel_summary`, queried directly via StarRocks''s JDBC catalog — bypassing `dashboard_funnel_serving` entirely, so the Databricks Iceberg cold branch is never touched.

        - **Right — Direct-from-Kafka:** `funnel_summary_direct`, a StarRocks VIEW recomputing the same 1-minute windows over raw events ingested by Routine Load jobs straight off the `page_views`/`cart_events`/`purchases` topics — no RisingWave in the loop at all (same pattern as the Wallet demo''s direct path). ~5s Routine Load batch interval vs the RisingWave path''s ~2-3s.


        ✅ **Pros:** Both fast (~0.7s) *and* genuinely fresh (zero staleness, no refresh cycle) — confirmed via direct benchmark against the full view for the identical last-hour result.


        ❌ **Cons:** Only shows whatever RisingWave currently retains — no historical fallback. If RisingWave restarts/loses its hot data (e.g. `bin/6_down.sh`), this chart goes blank until fresh data streams back in; the other two views still show Databricks-backed history.

        '
