    - ROW-5B
    meta:
      width: 12
      height: 28
      code: "**Data source:** `sr_local_db_sr_local_db.dashboard_funnel_serving_cached_direct`\
        \ -- a `UNION ALL` of the StarRocks materialized view `mv_unified_funnel_summary`\
        \ (REFRESH MANUAL, frozen at last rebuild) and the Direct-from-Kafka path's\
        \ rows (`funnel_summary_direct`, computed over the Routine-Load tables) newer\
        \ than the MV's latest window.\n\n**No double-counting by construction:**\
        \ the cutoff is `window_start > (SELECT MAX(window_start) FROM mv_unified_funnel_summary)`\
        \ -- the MV branch contributes every window it has, the direct branch only\
        \ windows strictly newer, so no window is served twice no matter when the\
        \ MV was last refreshed. If the MV is refreshed later, it takes over those\
        \ windows and the direct branch shrinks accordingly. An empty MV (fresh stack)\
        \ falls back to the direct branch serving everything. RW-independent: verified\
        \ live 2026-11-14 with the RisingWave containers stopped -- the view still\
        \ resolved and served continuous 2026-09-05 \u2192 now data (965 frozen MV\
        \ rows + fresh Routine-Load rows).\n\n\u2705 **Pros:** Fast (~0.2s), never\
        \ blank, and no external catalog touched at query time -- unlike the live\
        \ zero-copy charts (left above), this view survives the RW containers being\
        \ stopped.\n\n\u274C **Cons:** The MV branch is only as fresh as its last\
        \ rebuild (`REFRESH MATERIALIZED VIEW sr_local_db_sr_local_db.mv_unified_funnel_summary\
        \ WITH SYNC MODE;` picks up new Databricks history); until then new windows\
        \ come solely from the direct branch. There's no way to tell from the chart\
        \ alone which branch is currently serving a given window.\n"
  ROW-5B:
    type: ROW
