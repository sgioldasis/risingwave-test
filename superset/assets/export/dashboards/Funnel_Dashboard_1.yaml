      code: '### ✨ Async MV cache over the lake -- the cached funnel path

        - **At a glance:** an [asynchronous materialized view](https://docs.starrocks.io/docs/using_starrocks/async_mv/Materialized_view/) over Databricks Iceberg history, UNIONed with the live RisingWave branch by a cutoff predicate.

        - **Why here:** all-history daily charts would re-scan the lake on every dashboard load; the MV freezes the cold history (REFRESH MANUAL) and the UNION overlays RisingWave''s live rows on top.

        - **Value:** ~1.3s all-history queries that never go fully blank -- frozen MV snapshot underneath, live RW data on top -- versus multi-second raw Iceberg scans.

        - **RisingWave:** REQUIRED for freshness -- it is the source of the live rows that the UNION overlays on the frozen MV snapshot. Without RW the charts still render, but only from the MV''s last-rebuild state -- and nothing on screen tells you the hot data is missing.

        '
