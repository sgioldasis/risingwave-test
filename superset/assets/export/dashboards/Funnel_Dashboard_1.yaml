      code: '### ✨ JDBC catalog + Routine Load -- the hot funnel path

        - **At a glance:** a [JDBC external catalog](https://docs.starrocks.io/docs/data_source/catalog/jdbc_catalog/) (StarRocks queries RisingWave in place over the Postgres wire protocol -- no data copied) plus [Routine Load](https://docs.starrocks.io/docs/loading/kafka/RoutineLoad/) (Kafka topics land natively in StarRocks).

        - **Why here:** the funnel needs last-hour, minute-grained charts. Left: StarRocks reads RisingWave''s `funnel_summary` live through the catalog. Right: the raw topics feed StarRocks directly and a plain VIEW computes the same funnel -- no stream processor in the loop.

        - **Value:** sub-second dashboards on the freshest data either way -- and the right side proves the hot path keeps working even with RisingWave removed from the architecture.

        - **RisingWave:** on the left, REQUIRED -- RisingWave is the streaming layer: it consumes the page/cart/purchase topics, computes the 1-minute funnel windows in its materialized views, and serves them to StarRocks live over the JDBC catalog (goes blank if RW is down). On the right, NOT USED -- StarRocks ingests the same topics itself.

        '
