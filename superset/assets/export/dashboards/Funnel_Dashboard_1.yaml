    meta:
      width: 12
      height: 31
      code: "### \u2728 Funnel Over Time -- live vs RW-free cache, same last hour\n\
        - **Left -- Live (RisingWave REQUIRED):** [federated external catalogs](https://docs.starrocks.io/docs/data_source/catalog/)\
        \ -- one zero-copy view UNION ALLs a JDBC catalog (RisingWave hot rows) with\
        \ the Iceberg REST catalog (Databricks UC). Always fresh, zero data movement\
        \ -- but every load re-fetches external metadata (~5s), and RW down = the\
        \ whole view fails to resolve (Unknown database 'public.'), so the chart errors\
        \ rather than silently dropping the hot rows.\n- **Right -- Cached (RisingWave\
        \ NOT USED at query time):** an [asynchronous materialized view](https://docs.starrocks.io/docs/using_starrocks/async_mv/Materialized_view/)\
        \ over Databricks history UNIONed with the Direct-from-Kafka branch (same\
        \ Routine Load ingestion as the pair above) by a cutoff predicate. ~0.2s,\
        \ and it keeps working with the RW containers stopped (verified live 2026-11-14).\n\
        - **Value:** the mirror-image trade-off -- freshness vs independence. Detailed\
        \ data-source notes for both views below.\n- **How this differs from the section\
        \ above:** that pair showed two *ingestion* paths into StarRocks (stream processor\
        \ vs Routine Load); this pair shows two *serving* paths out of it -- a live\
        \ federated query paying the external-catalog cost on every load vs a precomputed\
        \ cache that doesn't. Same charts, same window, deliberately -- so cost and\
        \ RW-dependence are the only variables.\n"
