    - GRID_ID
    - ROW-5
    meta:
      width: 12
      height: 30
      code: "**Data source:** `sr_local_db_sr_local_db.dashboard_funnel_serving_cached`\
        \ -- a `UNION ALL` of the StarRocks materialized view `mv_unified_funnel_summary`\
        \ (REFRESH MANUAL, frozen at last rebuild) and everything RisingWave currently\
        \ retains, read live.\n\n**Intended fallback behavior:** the cutoff between\
        \ the two branches is `window_start < COALESCE(MIN(risingwave.window_start),\
        \ '9999-12-31')`. When RisingWave has any data, the live branch takes over\
        \ for everything at or after its earliest retained row, and the MV only fills\
        \ in what's older. When RisingWave is completely empty -- e.g. right after\
        \ a restart, before the producer has caught up -- `MIN()` returns NULL, the\
        \ COALESCE falls back to `9999-12-31`, and the MV serves as the sole source\
        \ for the whole view, by design (this is the same bootstrap-safety fallback\
        \ the \"Live\" view uses). Confirmed live (2026-09-11): with RisingWave at\
        \ 0 rows, the \"Last Hour\" chart showed 06:53-07:13 data entirely from the\
        \ MV's Databricks-cold branch as of its last rebuild (07:19) -- not live RisingWave,\
        \ and that's expected given RisingWave was empty at query time.\n\n\u2705\
        \ **Pros:** Fast (~1.3s), and never goes fully blank the way \"Hot-Only, Direct\"\
        \ does when RisingWave has no data -- the MV fallback keeps something on screen.\n\
        \n\u274C **Cons:** Whatever it's showing during a RisingWave-empty period\
        \ is only as fresh as the MV's last rebuild, which can be arbitrarily old\
        \ -- there's no way to tell from the chart alone which branch is currently\
        \ serving the data."
