      code: "**Data source:** `risingwave.public.funnel_summary`, queried directly\
        \ via StarRocks's JDBC catalog \u2014 bypassing `dashboard_funnel_serving`\
        \ entirely, so the Databricks Iceberg cold branch is never touched.\n\n\u2705\
        \ **Pros:** Both fast (~0.7s) *and* genuinely fresh (zero staleness, no refresh\
        \ cycle) \u2014 confirmed via direct benchmark against the full view for the\
        \ identical last-hour result.\n\n\u274C **Cons:** Only shows whatever RisingWave\
        \ currently retains \u2014 no historical fallback. If RisingWave restarts/loses\
        \ its hot data (e.g. `bin/6_down.sh`), this chart goes blank until fresh data\
        \ streams back in; the other two views still show Databricks-backed history."
