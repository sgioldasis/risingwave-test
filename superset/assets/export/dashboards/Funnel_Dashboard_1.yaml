    - ROW-6
    meta:
      width: 12
      height: 22
      code: "**Data source:** `sr_local_db_sr_local_db.dashboard_funnel_serving` \u2014\
        \ a zero-copy StarRocks view that `UNION ALL`s RisingWave (hot path, live\
        \ JDBC) with the Databricks Iceberg REST Catalog (cold path, historical).\n\
        \n\u26A0\uFE0F **For the \"Last Hour\" line chart above specifically, the\
        \ Databricks branch contributes ZERO rows** -- confirmed via direct benchmark:\
        \ querying the hot branch alone takes ~0.7s, but the full view (Databricks\
        \ branch included) takes ~5.1s for the identical last-hour result. StarRocks\
        \ still authenticates against the Iceberg REST catalog and reads its metadata\
        \ on every query regardless, even though nothing useful comes back -- that\
        \ wasted work is the entire reason this chart is slow. This is the mirror\
        \ image of the Cached chart's dead MV branch: there the dead branch is free\
        \ to skip, here it costs ~4.3s every time. Databricks genuinely matters for\
        \ **Daily Totals (Live)** to the right, which queries all history and really\
        \ does need it.\n\n\u2705 **Pros:** Always fresh \u2014 reflects RisingWave's\
        \ real-time state with zero staleness by construction, no refresh schedule\
        \ to trust or forget.\n\n\u274C **Cons:** Slow (~2-6s per query) for exactly\
        \ the reason above."
