      code: '### ✨ AGGREGATE KEY table -- running totals at storage level

        - **At a glance:** the [AGGREGATE KEY table model](https://docs.starrocks.io/docs/table_design/table_types/aggregate_table/) -- running totals maintained by the storage layer, fed by Routine Load off the raw topics.

        - **Why here:** three Routine Load jobs aggregate `page_views`/`cart_events`/`purchases` into one row per day+country; repeats merge on write.

        - **Value:** `SELECT *` already returns merged daily totals -- no MV, no query-time GROUP BY, no refresh; a table-model alternative to the MV-based Daily Totals charts above.

        - **RisingWave:** NOT USED -- the AGGREGATE table is fed by Routine Load straight off the raw topics; the aggregation the other charts get from RisingWave materialized views happens here inside StarRocks storage instead.

        '
